# Deployed at bike.shakiba.nl (pattern copied from ~/apps/hello on the server).
# Secrets (OPENAI_API_KEY, DEMO_PASSWORD) live only in ~/apps/bike/.env on the server.
services:
  app: # the API; must be named `app` for scripts/deploy.sh's /health check. Not public.
    image: ${APP_IMAGE} # Compose fills this from .env, written by scripts/deploy.sh on every deploy
    restart: unless-stopped
    networks:
      internal:
        aliases: [bike-api] # unique name: `app` is used by other apps' services too
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MODEL=openai/gpt-6-luna
      - PROMPT_VERSION=v3
    volumes:
      - logs:/app/logs # turn + feedback logs survive redeploys (Metrics page)

  ui: # Streamlit; the only public service
    image: ${APP_IMAGE}
    command: ["streamlit", "run", "ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    restart: unless-stopped
    networks: [web, internal]
    environment:
      - API_URL=http://bike-api:8000
      - DEMO_PASSWORD=${DEMO_PASSWORD}
    depends_on: [app]
    labels:
      - traefik.enable=true
      - traefik.docker.network=web
      - traefik.http.routers.bike.rule=Host(`bike.shakiba.nl`)
      - traefik.http.routers.bike.entrypoints=web
      - traefik.http.services.bike.loadbalancer.server.port=8501

networks:
  web:
    external: true
  internal:

volumes:
  logs:
