- id: status_shipped_eta_pressure
  messages:
    - "When is my e-bike actually arriving?? order CN-1044, I've got a trip planned and need an exact day"
  expected_tools: ["get_order_status"]
  must_not_promise: true
  answer_contains: ["shipped"]

- id: status_processing_deadline
  messages:
