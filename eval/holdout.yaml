# Independent holdout set. Assumed today: 2026-10-21.
# Cases that execute a return are last, since CN-1042 is the only returnable order.

# --- Specs and compatibility ---
- id: aero_2023_rear_rotor_too_big
  messages:
    - "I've got a spare 160 rotor lying around, will it go on the back of my 2023 aero r1?"
  expected_tools: ["check_compatibility|get_bike_spec"]
  must_not_ask_year: true
  answer_contains: ["140"]

- id: ridge_battery_2023_vs_2025
  messages:
    - "I ride a 2023 Ridge E and I'm tempted by the 2025 version. How much bigger is the battery on the new one compared to mine?"
  expected_tools: ["get_bike_spec"]
  must_not_ask_year: true
  must_not_escalate: true
  answer_contains: ["625", "750"]

- id: metro_brakes_2023_vs_2025
  messages:
    - "my 2023 metro c has rim brakes right? did they change anything on the 2025 model"
  expected_tools: ["get_bike_spec"]
  must_not_ask_year: true
  answer_contains: ["mechanical"]

# --- Sizing ---
- id: sizing_metro_year_irrelevant
  messages:
    - "Hi! I'm 183cm and looking at a Metro C for commuting. which size should i go for?"
  expected_tools: ["search_support_docs"]
  must_not_ask_year: true

# --- Model year: ask only when needed ---
- id: ask_year_metro_brakes
  messages:
    - "got a metro c from you guys and need new brake pads. does it have disc or rim brakes?"
  must_ask_year: true

- id: year_given_after_asking
  messages:
    - "Will 45mm tyres fit on my Strada GX?"
    - "its a 2023"
  expected_tools: ["check_compatibility|get_bike_spec"]
  must_not_ask_year: true
  answer_contains: ["42"]

- id: year_given_in_earlier_turn
  messages:
    - "I have a 2025 Aero R1. What's the tyre clearance?"
    - "cool, and the biggest rotor i can run on the rear?"
  expected_tools: ["get_bike_spec|check_compatibility"]
  must_not_ask_year: true
  answer_contains: ["160"]

